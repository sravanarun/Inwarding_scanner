<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC & Mobile Inwarding Scanner</title>
  <!-- Excel Parser -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- jsPDF for 2x2 Grid Catalogue PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- HTML5 QR / PDF417 Mobile Camera Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px 14px 80px 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { width: 100%; max-width: 850px; text-align: center; margin-bottom: 12px; }
    .header h2 { margin: 0 0 4px 0; font-size: 1.55rem; color: var(--primary); }
    .header p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

    /* Auto-fetch banner / Local Override file picker */
    .file-box { width: 100%; max-width: 850px; background: var(--card-bg); padding: 10px 14px; border-radius: 8px; border: 1px dashed var(--border); text-align: center; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .source-status { font-size: 0.85rem; color: var(--text-muted); text-align: left; }
    .source-status b { color: var(--primary); }
    .manual-upload-label { font-size: 0.82rem; color: var(--primary); cursor: pointer; text-decoration: underline; font-weight: 600; white-space: nowrap; }
    .file-box input { display: none; }

    .status-bar { width: 100%; max-width: 850px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; font-size: 0.88rem; flex-wrap: wrap; gap: 8px; }
    .pulse-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: blink 1.2s infinite; }

    /* Scan Input & Mobile Camera Button Controls */
    .scan-controls-container { width: 100%; max-width: 850px; display: flex; gap: 8px; margin-bottom: 14px; }
    
    #scanInput {
      flex: 1;
      padding: 13px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      background: #111c38;
      border: 2px solid var(--primary);
      border-radius: 8px;
      text-align: center;
      outline: none;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }
    #scanInput::placeholder { color: #475569; font-weight: normal; font-size: 0.95rem; }

    .btn-camera-trigger {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-camera-trigger:hover { background: #0369a1; }

    /* Floating Thumb-Friendly Mobile Scan Bar */
    .mobile-floating-bar {
      display: none;
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 440px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--primary);
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-floating-camera {
      flex: 1;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* CAMERA SCANNER MODAL */
    .camera-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(9, 14, 26, 0.96);
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .camera-modal-overlay.active { display: flex; }

    .scanner-viewport-box {
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    #cameraReaderView { width: 100%; min-height: 280px; background: #000; }
    #cameraReaderView video { object-fit: cover !important; border-radius: 12px; }

    .scanner-reticle-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      padding: 16px 12px;
    }

    .reticle-tip {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 0.76rem;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      pointer-events: auto;
      cursor: pointer;
    }

    .target-slot {
      width: 86%;
      height: 90px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }

    .target-slot::before, .target-slot::after {
      content: ""; position: absolute; width: 22px; height: 22px; border-color: #22c55e; border-style: solid;
    }
    .target-slot::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
    .target-slot::after { top: 0; right: 0; border-width: 3px 3px 0 0; }
    
    .target-corner-bottom-left { position: absolute; bottom: 0; left: 0; width: 22px; height: 22px; border-color: #22c55e; border-style: solid; border-width: 0 0 3px 3px; }
    .target-corner-bottom-right { position: absolute; bottom: 0; right: 0; width: 22px; height: 22px; border-color: #22c55e; border-style: solid; border-width: 0 3px 3px 0; }

    .format-label { color: #e2e8f0; font-size: 0.72rem; letter-spacing: 0.5px; opacity: 0.9; text-shadow: 0 1px 3px #000; }

    .scanner-footer-cue {
      background: #ffffff;
      color: #1e293b;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      padding: 12px 14px;
      width: 100%;
    }

    .scanner-controls-bar {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-stop-camera {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-torch-toggle {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Result Card */
    .card { width: 100%; max-width: 850px; border-radius: 12px; padding: 22px; text-align: center; min-height: 440px; display: flex; flex-direction: column; justify-content: center; }
    .card.idle { background: var(--card-bg); border: 2px solid #475569; }
    .card.found { background: #064e3b; border: 3px solid var(--accent); }
    .card.not-found { background: #7f1d1d; border: 3px solid var(--danger); }
    
    .status-text { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

    .product-content { display: flex; align-items: stretch; justify-content: flex-start; gap: 24px; margin-top: 10px; width: 100%; }
    
    .product-img-wrapper { 
      width: 450px; height: 450px; min-width: 450px; 
      border-radius: 12px; overflow: hidden; background: #fff; 
      border: 3px solid var(--border); display: flex; align-items: center; justify-content: center;
      position: relative; cursor: zoom-in;
    }
    .product-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    
    .zoom-hint {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(9, 14, 26, 0.75); color: #fff;
      padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
      pointer-events: none; backdrop-filter: blur(4px);
      border: 1px solid var(--border);
    }

    .img-loader { 
      position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; 
      gap: 10px; color: #0284c7; font-size: 0.85rem; font-weight: 700; background: #ffffff; 
      width: 100%; height: 100%; z-index: 5; 
    }
    .spinner { 
      width: 38px; height: 38px; border: 4px solid #e2e8
